<!DOCTYPE html>
<html>
    <head>
<title>
the map
</title>
<style>
    #map{
        width: 100%;
        height: 500px;
    }
    *{
        margin: 0;
        padding: 0;
    }
</style>
    </head>

    <body>
<div id="map"></div>
<script>
    function initMap(){
       var coordinates = {lat: 6.5184, lng: 3.3748};
       var map = new google.maps.Map(document.getElementById("map"),{zoom: 4, center: coordinates});
    }
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyApM3F4NEtQzlKNguVTSZL5f84_ndaqaFs&loading=async&callback=initMap"> </script>
    </body>
</html>
